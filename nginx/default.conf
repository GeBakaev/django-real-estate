server {
    listen 8080;

    client_max_body_size 100M;

    # Collected static assets (populated by collectstatic on container start)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # User uploads
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass web:8000;
    }
}
