server {
    listen 8080;

    # The app caps each photo at 15 MB; this leaves room for a listing saved with several.
    client_max_body_size 64M;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # Collected static assets (populated by collectstatic on container start)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # User uploads
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        include uwsgi_params;
        uwsgi_pass web:8000;
    }
}
