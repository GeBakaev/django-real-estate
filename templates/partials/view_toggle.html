{# List / Map switch that keeps the current filters. `active` is "list" or "map". #}
<nav class="inline-flex rounded-full border border-stone-200 bg-white p-1 text-sm font-semibold" aria-label="Results view">
    <a href="{% url 'properties' %}{% querystring page=None %}#properties" class="view-link{% if active == 'list' %} view-link-active{% endif %}"{% if active == 'list' %} aria-current="page"{% endif %}>List</a>
    <a href="{% url 'properties-map' %}{% querystring page=None %}#properties" class="view-link{% if active == 'map' %} view-link-active{% endif %}"{% if active == 'map' %} aria-current="page"{% endif %}>Map</a>
</nav>
