{% load static %}
<section class="relative isolate overflow-hidden bg-stone-950 text-white">
    <img src="{% static image|default:'images/page-header.webp' %}" alt="" class="absolute inset-0 -z-10 size-full object-cover opacity-40">
    <div class="container-x py-24 text-center sm:py-32">
        {% if eyebrow %}<p class="eyebrow-pill">{{ eyebrow }}</p>{% endif %}
        <h1 class="mt-3 font-display text-4xl font-bold uppercase tracking-wide sm:text-5xl">{{ title }}</h1>
        {% if subtitle %}<p class="mx-auto mt-6 max-w-2xl text-lg text-stone-300">{{ subtitle }}</p>{% endif %}
    </div>
</section>
